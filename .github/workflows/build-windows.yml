name: Build 32-bit portable Windows app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build Windows raw-print helper
        shell: powershell
        run: .\scripts\build-raw-helper.ps1

      - name: Run tests
        run: npm test

      - name: Test Windows paper settings
        shell: powershell
        run: .\scripts\test-paper-modes.ps1

      - name: Package 32-bit portable Windows app
        run: npm run package:win

      - name: Upload 32-bit portable Windows app
        uses: actions/upload-artifact@v4
        with:
          name: Mirocab-Print-Agent-Windows-${{ github.sha }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish portable download
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" dist/*.exe --title "Mirocab Print Agent $env:GITHUB_REF_NAME" --notes-file docs/RELEASE-1.11.0.fa.md --verify-tag
