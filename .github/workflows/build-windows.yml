name: Build Windows installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build Windows raw-print helper
        shell: powershell
        run: .\scripts\build-raw-helper.ps1

      - name: Run tests
        run: npm test

      - name: Package 32-bit and 64-bit Windows builds
        run: npm run package:win

      - name: Upload Windows installers and portable apps
        uses: actions/upload-artifact@v4
        with:
          name: Mirocab-Print-Agent-Windows-${{ github.sha }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
